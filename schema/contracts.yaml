# Firstmate depended-on contract map (seed).
# This file declares which firstmate surfaces the MCP superset depends on and how strictly.
# Behavior owners stay the script headers; this file is the dependency declaration only.
# Tiers and the observed-vs-depended-on rule are explained in README.md and schema/matrix.md.
version: v1
contracts:
  - name: fleet_snapshot
    command: bin/fm-fleet-snapshot.sh
    flags: ["--json"]
    output:
      format: json
      schema_id: fm-fleet-snapshot.v1
      fields: ["schema", "generated", "backlog", "tasks"]
    exits:
      zero: prints one JSON object with schema fm-fleet-snapshot.v1
      nonzero: snapshot refused or failed; stderr carries the reason
    stability: stable
    pinned: fm-fleet-snapshot.v1
    evidence:
      header: bin/fm-fleet-snapshot.sh:1-40
      doc: INVENTORY.md
    notes: Canonical whole-fleet read; backlog and fleet_poll derive from it.
  - name: backlog
    command: "derived: fleet_snapshot"
    flags: ["--json"]
    output:
      format: json
      schema_id: fm-fleet-snapshot.v1
      fields: ["generated", "backlog", "task_counts"]
    exits:
      zero: returns backlog records plus per-state task counts
      nonzero: inherits the fleet_snapshot failure
    stability: stable
    pinned: fm-fleet-snapshot.v1
    evidence:
      header: bin/fm-fleet-snapshot.sh:1-40
      doc: INVENTORY.md
    notes: Dispatch read; derives records from the snapshot instead of reimplementing a backend.
  - name: crew_state
    command: bin/fm-crew-state.sh
    flags: ["<id>"]
    output:
      format: line
      schema_id: fm-crew-state.v1
      fields: ["state", "source", "detail"]
    exits:
      zero: prints one stable line; never infers state from the status log tail
      nonzero: unknown id or unreadable endpoint; stderr carries the reason
    stability: stable
    pinned: fm-crew-state.v1
    evidence:
      header: bin/fm-crew-state.sh:1-30
      doc: INVENTORY.md
    notes: Deterministic current-state read; the status log tail is wake-event history only.
  - name: status_tail
    command: "file: state/<id>.status"
    flags: ["<id>", "lines=1..50"]
    output:
      format: text
      schema_id: status-log.v1
      fields: ["events", "warning"]
    exits:
      zero: returns the last lines with id validation and path confinement
      nonzero: no status log for id, or unreadable log
    stability: stable
    pinned: status-log.v1
    evidence:
      header: bin/fm-crew-state.sh:1-30
      doc: INVENTORY.md
    notes: Dispatch read; history only, never current state; 50-line cap.
  - name: send_message
    command: bin/fm-send.sh
    flags: ["<target>", "<text>"]
    output:
      format: text
      schema_id: none
      fields: ["delivered", "target"]
    exits:
      zero: verified submit per the fm-send contract; delivery is not reply
      nonzero: steer refused or failed, including swallowed Enter and slash commands
    stability: stable
    pinned: fm-send.plain-text.v1
    evidence:
      header: bin/fm-send.sh:1-30
      doc: INVENTORY.md
    notes: Plain-text path only; --key, --raw, and lifecycle verbs are out of scope.
  - name: spawn_crew
    command: bin/fm-spawn.sh
    flags: ["<task-id>", "<project>", "--mode", "--yolo"]
    output:
      format: text
      schema_id: none
      fields: ["task_id", "project", "mode"]
    exits:
      zero: direct report spawned under an explicit delivery contract
      nonzero: spawn refused, including mode mismatch with the brief
    stability: evolving
    pinned: fm-spawn.safe-subset.v1
    evidence:
      header: bin/fm-spawn.sh:1-30
      doc: INVENTORY.md
    notes: Dispatch write; safe flag subset only with no repo-mutation options.
  - name: scaffold_brief
    command: bin/fm-brief.sh
    flags: ["<task-id>", "<repo>", "--mode/--scout"]
    output:
      format: text
      schema_id: none
      fields: ["task_id", "project", "mode"]
    exits:
      zero: brief scaffolded; launches nothing
      nonzero: brief refused, including unrecognized flags
    stability: evolving
    pinned: fm-brief.safe-subset.v1
    evidence:
      header: bin/fm-brief.sh:1-30
      doc: INVENTORY.md
    notes: Dispatch write; scaffolds instructions without launching.
  - name: receipt_submit
    command: "native: receipt store (state/mcp-receipts/)"
    flags: ["<tool>", "<arguments>"]
    output:
      format: json
      schema_id: mcp-receipt.v1
      fields: ["status", "receipt_id", "tool", "check", "ttl_s"]
    exits:
      zero: call detached past the 30s budget; pending receipt returned immediately
      nonzero: unknown tool, bad arguments, or missing nested approval for Tier 3/4 targets
    stability: experimental
    pinned: mcp-receipt.v1
    evidence:
      header: fm_mcp_server.py:tool_receipt_submit
      doc: INVENTORY.md
    notes: Local envelope mechanic, no owning firstmate script; authority targets still need their nested approval string.
  - name: receipt_status
    command: "native: receipt store (state/mcp-receipts/)"
    flags: ["<receipt_id>"]
    output:
      format: json
      schema_id: mcp-receipt.v1
      fields: ["receipt_id", "status", "result", "ttl_s"]
    exits:
      zero: running, done with the result attached, or failed with the error attached
      nonzero: unknown receipt, invalid receipt_id, or expired past the TTL
    stability: experimental
    pinned: mcp-receipt.v1
    evidence:
      header: fm_mcp_server.py:tool_receipt_status
      doc: INVENTORY.md
    notes: Local envelope mechanic; receipts are confined to the serving home's state dir and expire after RECEIPT_TTL_S.
  - name: peek
    command: bin/fm-peek.sh
    flags: ["<target>", "lines=1..100"]
    output:
      format: text
      schema_id: none
      fields: ["target", "lines", "stdout"]
    exits:
      zero: bounded endpoint tail with target and line count echoed
      nonzero: unknown target or unreadable endpoint; stderr carries the reason
    stability: stable
    pinned: fm-peek.v1
    evidence:
      header: bin/fm-peek.sh:1-40
      doc: INVENTORY.md
    notes: Bounded 100-line cap with id validation; envelope truncates long tails.
  - name: fleet_view
    command: bin/fm-fleet-view.sh
    flags: ["<none>"]
    output:
      format: text
      schema_id: none
      fields: ["stdout"]
    exits:
      zero: human fleet render from the canonical snapshot
      nonzero: snapshot refused or jq missing; stderr carries the reason
    stability: stable
    pinned: fm-fleet-view.v1
    evidence:
      header: bin/fm-fleet-view.sh:1-40
      doc: INVENTORY.md
    notes: Human render only; --json prints the underlying snapshot which fleet_snapshot already serves.
  - name: review_diff
    command: bin/fm-review-diff.sh
    flags: ["<task-id>", "--stat"]
    output:
      format: text
      schema_id: none
      fields: ["id", "stat", "stdout"]
    exits:
      zero: branch-vs-base diff with id and stat flag echoed
      nonzero: unknown id, missing meta/worktree, or fetch failure; stderr carries the reason
    stability: stable
    pinned: fm-review-diff.v1
    evidence:
      header: bin/fm-review-diff.sh:1-30
      doc: INVENTORY.md
    notes: Read-only diff; envelope truncates long diffs.
  - name: bearings_snapshot
    command: bin/fm-bearings-snapshot.sh
    flags: ["--json"]
    output:
      format: json
      schema_id: fm-bearings.v1
      fields: ["schema", "generated", "in_flight", "decisions_open", "landed", "omitted"]
    exits:
      zero: prints one JSON projection with schema fm-bearings.v1
      nonzero: snapshot refused or failed; stderr carries the reason
    stability: stable
    pinned: fm-bearings.v1
    evidence:
      header: bin/fm-bearings-snapshot.sh:1-40
      doc: INVENTORY.md
    notes: Local-only projection; --include-prs network path stays out of scope.
  - name: wake_drain
    command: bin/fm-wake-drain.sh
    flags: ["<none>"]
    output:
      format: text
      schema_id: none
      fields: ["stdout"]
    exits:
      zero: drained-wake records emitted; empty queue exits 0 silently
      nonzero: queue lock or state unreadable; stderr carries the reason
    stability: stable
    pinned: fm-wake-drain.v1
    evidence:
      header: bin/fm-wake-drain.sh:1-40
      doc: INVENTORY.md
    notes: Consumes the durable wake queue as defined; the drain is the read.
  - name: guard_check
    command: bin/fm-guard.sh
    flags: ["<none>"]
    output:
      format: text
      schema_id: none
      fields: ["stdout"]
    exits:
      zero: liveness/tangle verdict printed; always exits 0, warn-only
      nonzero: never nonzero by contract; stderr carries diagnostics on hiccup
    stability: stable
    pinned: fm-guard.v1
    evidence:
      header: bin/fm-guard.sh:1-40
      doc: INVENTORY.md
    notes: Served with FM_GUARD_READ_ONLY=1 so the mirror never clears banner state.
