      format: text
      schema_id: none
      fields: ["task_id", "project", "mode"]
    exits:
      zero: brief scaffolded; launches nothing
      nonzero: brief refused, including unrecognized flags
    stability: evolving
    pinned: fm-brief.safe-subset.v1
    evidence:
      header: bin/fm-brief.sh:1-30
      doc: INVENTORY.md
    notes: Dispatch write; scaffolds instructions without launching.
  - name: receipt_submit
    command: "native: receipt store (state/mcp-receipts/)"
    flags: ["<tool>", "<arguments>"]
    output:
      format: json
      schema_id: mcp-receipt.v1
      fields: ["status", "receipt_id", "tool", "check", "ttl_s"]
    exits:
      zero: call detached past the 30s budget; pending receipt returned immediately
      nonzero: unknown tool, bad arguments, or missing nested approval for Tier 3/4 targets
    stability: experimental
    pinned: mcp-receipt.v1
    evidence:
      header: fm_mcp_server.py:tool_receipt_submit
      doc: INVENTORY.md
    notes: Local envelope mechanic, no owning firstmate script; authority targets still need their nested approval string.
  - name: receipt_status
