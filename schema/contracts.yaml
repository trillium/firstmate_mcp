    output:
      format: json
      schema_id: mcp-grant.v1
      fields: ["status", "grant_id", "grant_ref", "revoked_at", "reason"]
    exits:
      zero: revokes standing approval grant immediately
      nonzero: unknown grant_id, bad arguments, or missing approval
    stability: experimental
    pinned: mcp-grant.v1
    evidence:
      header: ts/src/grants.ts:revokeGrant
      doc: AUTH.md
    notes: Local standing approval revocation; revoked grants fail closed immediately.
  - name: grant_status
    command: "native: standing grant store (state/mcp-grants/)"
