    output:
      format: json
      schema_id: mcp-grant.v1
      fields: ["grant_id", "grant_ref", "issuer", "grantee", "tier_limit", "tools", "projects", "created_at", "expires_at", "is_expired", "revoked_at", "is_revoked", "use_count", "max_uses", "is_valid", "note"]
    exits:
      zero: safe metadata inspection of standing approval grants (never exposes secrets)
      nonzero: unknown grant_id
    stability: experimental
    pinned: mcp-grant.v1
    evidence:
      header: ts/src/grants.ts:getGrantStatus
      doc: AUTH.md
    notes: Local standing approval read inspection; confined to safe metadata without secret tokens or hashes.
