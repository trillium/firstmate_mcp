# Firstmate depended-on contract map (seed).
# This file declares which firstmate surfaces the MCP superset depends on and how strictly.
# Behavior owners stay the script headers; this file is the dependency declaration only.
# Tiers and the observed-vs-depended-on rule are explained in README.md and schema/matrix.md.
version: v1
contracts:
  - name: fleet_snapshot
    command: bin/fm-fleet-snapshot.sh
    flags: ["--json"]
    output:
      format: json
      schema_id: fm-fleet-snapshot.v1
      fields: ["schema", "generated", "backlog", "tasks"]
    exits:
      zero: prints one JSON object with schema fm-fleet-snapshot.v1
      nonzero: snapshot refused or failed; stderr carries the reason
    stability: stable
    pinned: fm-fleet-snapshot.v1
    evidence:
      header: bin/fm-fleet-snapshot.sh:1-40
      doc: INVENTORY.md
    notes: Canonical whole-fleet read; backlog and fleet_poll derive from it.
  - name: backlog
    command: "derived: fleet_snapshot"
    flags: ["--json"]
    output:
      format: json
      schema_id: fm-fleet-snapshot.v1
      fields: ["generated", "backlog", "task_counts"]
    exits:
      zero: returns backlog records plus per-state task counts
      nonzero: inherits the fleet_snapshot failure
    stability: stable
    pinned: fm-fleet-snapshot.v1
    evidence:
      header: bin/fm-fleet-snapshot.sh:1-40
      doc: INVENTORY.md
    notes: Dispatch read; derives records from the snapshot instead of reimplementing a backend.
  - name: crew_state
    command: bin/fm-crew-state.sh
    flags: ["<id>"]
    output:
      format: line
      schema_id: fm-crew-state.v1
      fields: ["state", "source", "detail"]
    exits:
      zero: prints one stable line; never infers state from the status log tail
      nonzero: unknown id or unreadable endpoint; stderr carries the reason
    stability: stable
    pinned: fm-crew-state.v1
    evidence:
      header: bin/fm-crew-state.sh:1-30
      doc: INVENTORY.md
    notes: Deterministic current-state read; the status log tail is wake-event history only.
  - name: status_tail
    command: "file: state/<id>.status"
    flags: ["<id>", "lines=1..50"]
    output:
      format: text
      schema_id: status-log.v1
      fields: ["events", "warning"]
    exits:
      zero: returns the last lines with id validation and path confinement
      nonzero: no status log for id, or unreadable log
    stability: stable
    pinned: status-log.v1
    evidence:
      header: bin/fm-crew-state.sh:1-30
      doc: INVENTORY.md
    notes: Dispatch read; history only, never current state; 50-line cap.
  - name: send_message
    command: bin/fm-send.sh
    flags: ["<target>", "<text>"]
    output:
      format: text
      schema_id: none
      fields: ["delivered", "target"]
    exits:
      zero: verified submit per the fm-send contract; delivery is not reply
      nonzero: steer refused or failed, including swallowed Enter and slash commands
    stability: stable
    pinned: fm-send.plain-text.v1
    evidence:
      header: bin/fm-send.sh:1-30
      doc: INVENTORY.md
    notes: Plain-text path only; --key, --raw, and lifecycle verbs are out of scope.
  - name: spawn_crew
    command: bin/fm-spawn.sh
    flags: ["<task-id>", "<project>", "--mode", "--yolo"]
    output:
      format: text
      schema_id: none
      fields: ["task_id", "project", "mode"]
    exits:
      zero: direct report spawned under an explicit delivery contract
      nonzero: spawn refused, including mode mismatch with the brief
    stability: evolving
    pinned: fm-spawn.safe-subset.v1
    evidence:
      header: bin/fm-spawn.sh:1-30
      doc: INVENTORY.md
    notes: Dispatch write; safe flag subset only with no repo-mutation options.
  - name: scaffold_brief
    command: bin/fm-brief.sh
    flags: ["<task-id>", "<repo>", "--mode/--scout"]
    output:
      format: text
      schema_id: none
      fields: ["task_id", "project", "mode"]
    exits:
      zero: brief scaffolded; launches nothing
      nonzero: brief refused, including unrecognized flags
    stability: evolving
    pinned: fm-brief.safe-subset.v1
    evidence:
      header: bin/fm-brief.sh:1-30
      doc: INVENTORY.md
    notes: Dispatch write; scaffolds instructions without launching.
  - name: receipt_submit
    command: "native: receipt store (state/mcp-receipts/)"
    flags: ["<tool>", "<arguments>"]
    output:
      format: json
      schema_id: mcp-receipt.v1
      fields: ["status", "receipt_id", "tool", "check", "ttl_s"]
    exits:
      zero: call detached past the 30s budget; pending receipt returned immediately
      nonzero: unknown tool, bad arguments, or missing nested approval for Tier 3/4 targets
    stability: experimental
    pinned: mcp-receipt.v1
    evidence:
      header: fm_mcp_server.py:tool_receipt_submit
      doc: INVENTORY.md
    notes: Local envelope mechanic, no owning firstmate script; authority targets still need their nested approval string.
  - name: receipt_status
    command: "native: receipt store (state/mcp-receipts/)"
    flags: ["<receipt_id>"]
    output:
      format: json
      schema_id: mcp-receipt.v1
      fields: ["receipt_id", "status", "result", "ttl_s"]
    exits:
      zero: running, done with the result attached, or failed with the error attached
      nonzero: unknown receipt, invalid receipt_id, or expired past the TTL
    stability: experimental
    pinned: mcp-receipt.v1
    evidence:
      header: fm_mcp_server.py:tool_receipt_status
      doc: INVENTORY.md
    notes: Local envelope mechanic; receipts are confined to the serving home's state dir and expire after RECEIPT_TTL_S.
  - name: peek
    command: bin/fm-peek.sh
    flags: ["<target>", "lines=1..100"]
    output:
      format: text
      schema_id: none
      fields: ["target", "lines", "stdout"]
    exits:
      zero: bounded endpoint tail with target and line count echoed
      nonzero: unknown target or unreadable endpoint; stderr carries the reason
    stability: stable
    pinned: fm-peek.v1
    evidence:
      header: bin/fm-peek.sh:1-40
      doc: INVENTORY.md
    notes: Bounded 100-line cap with id validation; envelope truncates long tails.
  - name: fleet_view
    command: bin/fm-fleet-view.sh
    flags: ["<none>"]
    output:
      format: text
      schema_id: none
      fields: ["stdout"]
    exits:
      zero: human fleet render from the canonical snapshot
      nonzero: snapshot refused or jq missing; stderr carries the reason
    stability: stable
    pinned: fm-fleet-view.v1
    evidence:
      header: bin/fm-fleet-view.sh:1-40
      doc: INVENTORY.md
    notes: Human render only; --json prints the underlying snapshot which fleet_snapshot already serves.
  - name: review_diff
    command: bin/fm-review-diff.sh
    flags: ["<task-id>", "--stat"]
    output:
      format: text
      schema_id: none
      fields: ["id", "stat", "stdout"]
    exits:
      zero: branch-vs-base diff with id and stat flag echoed
      nonzero: unknown id, missing meta/worktree, or fetch failure; stderr carries the reason
    stability: stable
    pinned: fm-review-diff.v1
    evidence:
      header: bin/fm-review-diff.sh:1-30
      doc: INVENTORY.md
    notes: Read-only diff; envelope truncates long diffs.
  - name: bearings_snapshot
    command: bin/fm-bearings-snapshot.sh
    flags: ["--json"]
    output:
      format: json
      schema_id: fm-bearings.v1
      fields: ["schema", "generated", "in_flight", "decisions_open", "landed", "omitted"]
    exits:
      zero: prints one JSON projection with schema fm-bearings.v1
      nonzero: snapshot refused or failed; stderr carries the reason
    stability: stable
    pinned: fm-bearings.v1
    evidence:
      header: bin/fm-bearings-snapshot.sh:1-40
      doc: INVENTORY.md
    notes: Local-only projection; --include-prs network path stays out of scope.
  - name: wake_drain
    command: bin/fm-wake-drain.sh
    flags: ["<none>"]
    output:
      format: text
      schema_id: none
      fields: ["stdout"]
    exits:
      zero: drained-wake records emitted; empty queue exits 0 silently
      nonzero: queue lock or state unreadable; stderr carries the reason
    stability: stable
    pinned: fm-wake-drain.v1
    evidence:
      header: bin/fm-wake-drain.sh:1-40
      doc: INVENTORY.md
    notes: Consumes the durable wake queue as defined; the drain is the read.
  - name: guard_check
    command: bin/fm-guard.sh
    flags: ["<none>"]
    output:
      format: text
      schema_id: none
      fields: ["stdout"]
    exits:
      zero: liveness/tangle verdict printed; always exits 0, warn-only
      nonzero: never nonzero by contract; stderr carries diagnostics on hiccup
    stability: stable
    pinned: fm-guard.v1
    evidence:
      header: bin/fm-guard.sh:1-40
      doc: INVENTORY.md
    notes: Served with FM_GUARD_READ_ONLY=1 so the mirror never clears banner state.
  - name: remote_doctor
    command: bin/fm-remote-doctor.sh
    flags: ["<none>"]
    output:
      format: text
      schema_id: none
      fields: ["stdout"]
    exits:
      zero: readiness checks printed, one fact per line
      nonzero: a gating check failed or a required tool is missing; stderr carries the reason
    stability: stable
    pinned: fm-remote-doctor.v1
    evidence:
      header: bin/fm-remote-doctor.sh:1-40
      doc: INVENTORY.md
    notes: Check mode only; the --fix repair path stays out of scope.
  - name: remote_file
    command: bin/fm-remote-file.sh
    flags: ["get", "<relative-path>", "<max-bytes>"]
    output:
      format: text
      schema_id: none
      fields: ["path", "max_bytes", "stdout"]
    exits:
      zero: bounded file bytes with path and byte bound echoed
      nonzero: traversal, symlink, missing file, or unreadable home; stderr carries the reason
    stability: stable
    pinned: fm-remote-file.get.v1
    evidence:
      header: bin/fm-remote-file.sh:1-40
      doc: INVENTORY.md
    notes: Get only; the put handoff-intake path stays out of scope. Bounded 8KB default; envelope truncates at 8KB.
  - name: remote_delta
    command: bin/fm-remote-delta-read.sh
    flags: ["<relative-log>", "<offset>", "<prefix-sha256>", "<wait-seconds>"]
    output:
      format: text
      schema_id: none
      fields: ["log", "offset", "stdout"]
    exits:
      zero: appended lines after the validated cursor, at most 64KB, with log and offset echoed
      nonzero: continuity break, bad cursor, or unreadable log; exit 75 means the wait window closed empty
    stability: stable
    pinned: fm-remote-delta-read.v1
    evidence:
      header: bin/fm-remote-delta-read.sh:1-30
      doc: INVENTORY.md
    notes: Read-only poll; the wait is clamped to 0..10s so no call nears the 30s envelope.
  - name: handoff_status
    command: "file: data/handoff/<id>.outbox.md"
    flags: ["<id>", "lines=1..20"]
    output:
      format: text
      schema_id: handoff-outbox.v1
      fields: ["outboxes", "id", "bytes", "total_lines", "lines"]
    exits:
      zero: staged outbox listing, or one outbox tail with id validation and path confinement
      nonzero: no outbox for id, or unreadable handoff dir
    stability: stable
    pinned: handoff-outbox.v1
    evidence:
      header: bin/fm-backlog-handoff.sh:1-40
      doc: INVENTORY.md
    notes: Dispatch read; staged moves only, never the move itself. Handoff owns moves, receive owns intake.
  - name: secondmate_nudge
    command: bin/fm-secondmate-reconcile.sh
    flags: ["notify"]
    output:
      format: text
      schema_id: none
      fields: ["stdout"]
    exits:
      zero: per-home notify lines (sent/cooldown/skipped/stale/failed); empty mismatch set exits 0 silently
      nonzero: at least one due send failed or its cooldown could not be recorded
    stability: evolving
    pinned: fm-reconcile.notify.v1
    evidence:
      header: bin/fm-secondmate-reconcile.sh:1-40
      doc: INVENTORY.md
    notes: Dispatch write; notify-only subset with cooldown guard. request/process-requests stay out.
  - name: secondmate_restart
    command: bin/fm-secondmate-restart.sh
    flags: ["<secondmate-id>..."]
    output:
      format: text
      schema_id: none
      fields: ["ids", "stdout"]
    exits:
      zero: every named mate restarted; exit 3 means partial (nudged/unreached but accounted for)
      nonzero: unusable input (1) or invalid use (2); stderr carries the reason
    stability: evolving
    pinned: fm-secondmate-restart.v1
    evidence:
      header: bin/fm-secondmate-restart.sh:1-40
      doc: INVENTORY.md
    notes: Dispatch write; ids only, no flags. Persist-gate semantics stay in the owning script.
  - name: secondmate_report
    command: bin/fm-secondmate-report.sh
    flags: ["<verb>", "<corr>", "<note>"]
    output:
      format: text
      schema_id: none
      fields: ["verb", "corr", "stdout"]
    exits:
      zero: correlated report appended to the parent channel the helper resolves
      nonzero: bad corr, unresolvable parent channel, or unwritable destination
    stability: evolving
    pinned: fm-secondmate-report.v1
    evidence:
      header: bin/fm-secondmate-report.sh:1-40
      doc: INVENTORY.md
    notes: Dispatch write; note-only form. The helper resolves the destination, so no status path crosses the boundary; --doc stays out.
  - name: remote_control
    command: bin/fm-remote-secondmate-control.sh
    flags: ["<verb>", "<id>"]
    output:
      format: text
      schema_id: none
      fields: ["verb", "id", "stdout"]
    exits:
      zero: verb output with verb and id echoed
      nonzero: unknown mate, unavailable home, or refused verb; stderr carries the reason
    stability: evolving
    pinned: fm-remote-control.safe-subset.v1
    evidence:
      header: bin/fm-remote-secondmate-control.sh:1-40
      doc: INVENTORY.md
    notes: Dispatch write; closed state/route/observe/send subset. launch/relaunch, key/capture, and sync/update/retire stay out.
  - name: handoff_move
    command: bin/fm-backlog-handoff.sh
    flags: ["<secondmate-id>", "<item-key>...", "--resume-pending"]
    output:
      format: text
      schema_id: none
      fields: ["id", "keys", "resumed", "stdout"]
    exits:
      zero: queued items moved, or pending wakes resumed, with id echoed
      nonzero: move refused (in-flight items, beads destination, unknown mate); stderr carries the reason
    stability: evolving
    pinned: fm-handoff.safe-subset.v1
    evidence:
      header: bin/fm-backlog-handoff.sh:1-40
      doc: INVENTORY.md
    notes: Dispatch write; move plus resume-pending only. Moves only Queued items via the backend owner.
  - name: harness_detect
    command: bin/fm-harness.sh
    flags: ["own", "crew", "secondmate", "secondmate-model", "secondmate-effort"]
    output:
      format: text
      schema_id: none
      fields: ["mode", "harness", "stdout"]
    exits:
      zero: harness name for the mode with mode echoed
      nonzero: detection refused or failed; stderr carries the reason
    stability: stable
    pinned: fm-harness.v1
    evidence:
      header: bin/fm-harness.sh:1-20
      doc: INVENTORY.md
    notes: Closed mode subset; ancestry/ancestry-descent pid walks and validate-native-effort stay out.
  - name: project_mode
    command: bin/fm-project-mode.sh
    flags: ["<project>"]
    output:
      format: text
      schema_id: none
      fields: ["project", "mode", "yolo", "stdout"]
    exits:
      zero: registered "<mode> <yolo>" pair with project echoed; unknown projects fall back to no-mistakes off with a stderr warning
      nonzero: registry unreadable in a way the fallback cannot cover; stderr carries the reason
    stability: stable
    pinned: fm-project-mode.v1
    evidence:
      header: bin/fm-project-mode.sh:1-30
      doc: INVENTORY.md
    notes: Mapped mode+yolo only; --raw stays out (denied argv flag), so conditional policies resolve to their most rigorous leg.
  - name: lock_status
    command: bin/fm-lock.sh
    flags: ["status"]
    output:
      format: text
      schema_id: none
      fields: ["status", "raw", "stdout"]
    exits:
      zero: holder and liveness line with a free/held/stale/unreadable projection; always exits 0
      nonzero: never nonzero by contract; stderr carries diagnostics on hiccup
    stability: stable
    pinned: fm-lock.status.v1
    evidence:
      header: bin/fm-lock.sh:1-20
      doc: INVENTORY.md
    notes: Status only; acquiring would steal firstmate's own session lock and stays out.
  - name: lease_check
    command: bin/fm-lease.sh
    flags: ["check", "<task>"]
    output:
      format: text
      schema_id: none
      fields: ["task_id", "leased", "holder", "actor", "pid", "epoch", "live"]
    exits:
      zero: holder line projected with task echoed (actor pid epoch live|stale)
      nonzero: exit 1 with empty stdout is the defined unleased outcome; other exits are typed failures with stderr carried
    stability: stable
    pinned: fm-lease.check.v1
    evidence:
      header: bin/fm-lease.sh:1-40
      doc: INVENTORY.md
    notes: Check only; claim/release/release-actor/sweep are guarded by the supervision-actor contract and stay out.
  - name: bearings_board_path
    command: bin/fm-bearings-board.sh
    flags: ["path"]
    output:
      format: text
      schema_id: none
      fields: ["path", "stdout"]
    exits:
      zero: stable board path for this home with path echoed
      nonzero: board path unresolvable; stderr carries the reason
    stability: stable
    pinned: fm-bearings-board.path.v1
    evidence:
      header: bin/fm-bearings-board.sh:1-40
      doc: INVENTORY.md
    notes: Path only; build proves a live lavish session and binds the keyed-answer intake, which stays firstmate/agent-owned.
  - name: inbox_status
    command: bin/fm-inbox.sh
    flags: ["status"]
    output:
      format: text
      schema_id: none
      fields: ["stdout"]
    exits:
      zero: durable-records status with no wake sent and no network read
      nonzero: records unreadable; stderr carries the reason
    stability: stable
    pinned: fm-inbox.status.v1
    evidence:
      header: bin/fm-inbox.sh:1-40
      doc: INVENTORY.md
    notes: Status only; note/say queue wakes or call Bedrock and drain --ack moves records, so all stay out.
  - name: inbox_list
    command: bin/fm-inbox.sh
    flags: ["list"]
    output:
      format: text
      schema_id: none
      fields: ["stdout"]
    exits:
      zero: queued note ids with bodies, or the empty marker
      nonzero: inbox unreadable; stderr carries the reason
    stability: stable
    pinned: fm-inbox.list.v1
    evidence:
      header: bin/fm-inbox.sh:1-40
      doc: INVENTORY.md
    notes: List only; same out-of-scope set as inbox_status.
  - name: home_summary
    command: "file: state/home-summary.json"
    flags: ["<none>"]
    output:
      format: json
      schema_id: fm-secondmate-home-summary.v1
      fields: ["schema", "generated", "generated_epoch", "state", "counts"]
    exits:
      zero: published ledger parsed with schema fm-secondmate-home-summary.v1
      nonzero: unpublished, unreadable, oversize, or off-schema ledger; the reason names which
    stability: stable
    pinned: fm-secondmate-home-summary.v1
    evidence:
      header: bin/fm-home-summary-refresh.sh:1-20
      doc: INVENTORY.md
    notes: Dispatch read; ledger only, never the refresh. Refresh is firstmate-owned plumbing (session start, watcher, spawn, teardown call it --best-effort).
  - name: contributions_snapshot
    command: bin/fm-contributions.sh
    flags: ["snapshot", "<contribution-input>", "--all"]
    output:
      format: json
      schema_id: none
      fields: ["known", "checked", "counts", "captain", "all"]
    exits:
      zero: owned-contribution coverage projected over the staged backlog/tasks pair with the all flag echoed
      nonzero: contribution-input staging or the snapshot refused or failed; stderr carries the reason
    stability: stable
    pinned: fm-contributions.snapshot.v1
    evidence:
      header: bin/fm-contributions.sh:1-30
      doc: INVENTORY.md
    notes: Snapshot only over the same contribution-input the fleet snapshot stages; poll spends forge reads and verdict/ack/arm mutate records, so all stay out.
  - name: contributions_pending
    command: bin/fm-contributions.sh
    flags: ["pending"]
    output:
      format: json
      schema_id: none
      fields: ["pending"]
    exits:
      zero: pending event tokens with task and url attached, or an empty list
      nonzero: saved records unreadable; stderr carries the reason
    stability: stable
    pinned: fm-contributions.pending.v1
    evidence:
      header: bin/fm-contributions.sh:1-30
      doc: INVENTORY.md
    notes: Pending only; same out-of-scope set as contributions_snapshot.
