    output:
      format: json
      schema_id: mcp-receipt.v1
      fields: ["receipt_id", "status", "result", "ttl_s"]
    exits:
      zero: running, done with the result attached, or failed with the error attached
      nonzero: unknown receipt, invalid receipt_id, or expired past the TTL
    stability: experimental
    pinned: mcp-receipt.v1
    evidence:
      header: fm_mcp_server.py:tool_receipt_status
      doc: INVENTORY.md
    notes: Local envelope mechanic; receipts are confined to the serving home's state dir and expire after RECEIPT_TTL_S.
  - name: grant_mint
    command: "native: standing grant store (state/mcp-grants/)"
    flags: ["<grantee>", "tier_limit=1..4", "tools=[...]", "projects=[...]", "ttl_s=1..2592000", "max_uses=int", "note=str", "<approval>"]
    output:
      format: json
      schema_id: mcp-grant.v1
      fields: ["grant_id", "grant_ref", "token", "issuer", "grantee", "tier_limit", "tools", "projects", "created_at", "expires_at", "ttl_s", "max_uses", "note"]
    exits:
      zero: mints new scoped standing approval grant; returns secret token once
      nonzero: invalid arguments, forbidden tools in grant, or missing approval
    stability: experimental
    pinned: mcp-grant.v1
    evidence:
      header: ts/src/grants.ts:mintGrant
      doc: AUTH.md
    notes: Local standing approval primitive for autonomous workflows; hash stored on disk, token never logged.
  - name: grant_revoke
    command: "native: standing grant store (state/mcp-grants/)"
