# Durable feature manifest for firstmate_mcp (beads epic task-8d0ah, ARCHITECTURE).
#
# Every tracked capability carries a stable identity, upstream provenance,
# behavioral contract pointer, upstream test provenance, Python and TypeScript
# implementation status, and explicit divergence status/reason where our
# behavior intentionally differs. Local-only Trillium extensions live in the
# same manifest with kind `local` so they survive upstream reconciliation.
#
# Authority rules:
#   - Script headers own behavior; schema/contracts.yaml owns the depended-on
#     declaration; drift/baseline.json owns the observed-surface pin.
#   - This file tracks capability identity and status only. It never
#     re-declares output schemas, flag subsets, or envelope constants — it
#     points at the files that do.
#   - A status must never claim an implementation that does not exist:
#     `manifest/validate.py` spot-checks every `implemented` evidence pointer
#     against the tree.
#
# Validate: python3 manifest/validate.py
# Human view: manifest/README.md
version: v1
upstream:
  repo: https://github.com/kunchenguid/firstmate.git
  submodule: sources/firstmate
  gitlink_at_seed: 3eb5b6334a80e06083e3837f0032a5cec39b8e52
  baseline: drift/baseline.json
  baseline_rev_at_seed: aaf67489
  baseline_surfaces_at_seed: 163
  note: >-
    Upstream provenance for mirrored entries is the owning bin/fm-*.sh path at
    the tracked firstmate revision (drift/baseline.json is the quantitative
    pin; drift/shift.py diffs the submodule pin against upstream main).
    The submodule is not checked out in every worktree, so per-entry
    provenance names the owning command path rather than a vendored line.
features:
  # ---- SUPPORTED: behavior-identical reads + safe steer (no approval) ----
  - id: fleet_snapshot
    kind: upstream-mirror
    summary: Canonical whole-fleet read; typed projection equals the owning script's observable output modulo the envelope wrap.
