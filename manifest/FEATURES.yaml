# Durable feature manifest for firstmate_mcp (beads epic task-8d0ah, ARCHITECTURE).
#
# Every tracked capability carries a stable identity, upstream provenance,
# behavioral contract pointer, upstream test provenance, Python and TypeScript
# implementation status, and explicit divergence status/reason where our
# behavior intentionally differs. Local-only Trillium extensions live in the
# same manifest with kind `local` so they survive upstream reconciliation.
#
# Authority rules:
#   - Script headers own behavior; schema/contracts.yaml owns the depended-on
#     declaration; drift/baseline.json owns the observed-surface pin.
#   - This file tracks capability identity and status only. It never
#     re-declares output schemas, flag subsets, or envelope constants — it
#     points at the files that do.
#   - A status must never claim an implementation that does not exist:
#     `manifest/validate.py` spot-checks every `implemented` evidence pointer
#     against the tree.
#
# Validate: python3 manifest/validate.py
# Human view: manifest/README.md
version: v1
upstream:
  repo: https://github.com/kunchenguid/firstmate.git
  submodule: sources/firstmate
  gitlink_at_seed: 9296f9b9d2566797b9a9aecaa5956bb8e471d2cd
  baseline: drift/baseline.json
  baseline_rev_at_seed: aaf67489
  baseline_surfaces_at_seed: 163
  role: radar
  note: >-
    Upstream fingerprint for early-warning radar only: the kunchenguid pin
    (submodule gitlink) plus the drift baseline revision/surface count.
    drift/shift.py watches this pin against upstream main; a shift report
    is a deliberate port decision, never an automatic merge. Nothing runs
    against this copy — see `fork` below for the working line.
    Re-seeded 2026-09-22 from 1b1b6e05 (25 commits behind main, identical
    196-script name surface): 47 of 177 surfaces actually changed. The first
    read of that shift claimed 177/177 because drift also compared checkout
    mtime and the executed-help fields; drift/diff.py now compares content
    only — see its IGNORED_FIELDS and module docstring.
    Re-seeded 2026-09-22 from 884d76bd (2 commits: #4907 keyed-answer wake
    suppression, #4900 secondmate relaunch with vanished watcher scratch). One
    depended-on surface moved — fm-send.sh (contract send_message), comment-only:
    the interface, argv and output are unchanged, so no doorway port is needed and
    the pin bump carries the fix plus its new upstream tests.
    Re-seeded again 2026-09-22 from f5735dc2 (4 commits: #5334, #5327, #5317,
    #5294). One depended-on surface moved — fm-crew-state.sh (contract
    crew_state), a CI-state fix: passed-with-override now reads as done, and
    "base branch advanced, re-arming CI monitor timeout" is no longer treated
    as a marker (it held green PRs at working while main advanced). No doorway
    port needed: that contract passes the script's line through and no TS
    enumerates state words, so the pin bump carries the fix.
fork:
  repo: https://github.com/trillium/firstmate.git
  proven_commit: 86c035336bf9e136dd44d76e7d46e16d260fac8f
  proven_date: "2026-09-17"
  proven_subject: "feat(wake): fold inbox-supervision delivery into one PR (task-z8sn4) (#160)"
  served_commit: aaf67489ec7644f3bdfd4043ba0c898ab928bcd9
  served_date: "2026-09-06"
  merge_base_with_upstream: 53ecbc7961ac066461ea3104c713d81d40fb32d6
  merge_base_date: 2026-08-10
  commits_ahead_at_seed: 204
  basis: UPSTREAM-RESULTS.md seed 2026-09-18 plus CUTOVER-PROOF.md basis 2026-09-17
  role: working-copy
  note: >-
    Working-copy pin, in two parts because they are two different revs and a
    single pin made that ambiguous (owner asked 2026-09-22 and the manifest could
    not answer cleanly).
    `proven_commit` is the PROOF BASIS: the fork HEAD when CUTOVER-PROOF.md and
    UPSTREAM-RESULTS.md were produced. It is history and does not move unless the
    adapter is re-proven.
    `served_commit` is the line the fleet actually runs (FM_HOME). It must equal
    `drift/baseline.json: firstmate_revision`, which is the observed inventory of
    that same checkout — manifest/validate.py fails loudly when they disagree, so a
    moved fleet home cannot leave this file quietly wrong.
    As of 2026-09-22 these are aaf67489 (served, 2026-09-06) and 86c03533 (proof
    basis, 2026-09-17): the fleet runs a line 11 days OLDER than the proof basis,
    while the fork's own origin/main tip is 9894cd27 (2026-09-22), 11 commits ahead
    of the served home. That gap is operational, not a doorway defect, and is
    tracked as project-2od.13 — serving a stale fleet line is the owner's call, and
    the doorway cannot fix it by itself because the served checkout also carries
    uncommitted work.
