    ts: {status: implemented, evidence: ["ts/src/tools.ts:fleet_snapshot"]}
    divergence: {status: none, reason: ""}
  - id: backlog
    kind: upstream-mirror
    summary: Backlog records plus per-state counts derived from the fleet snapshot instead of reimplementing a backend.
