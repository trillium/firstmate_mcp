    upstream_flags: ["--json"]
    contract: schema/contracts.yaml#fleet_snapshot
    upstream_test: "tests/conformance/test_conformance.py::test_fleet_snapshot_matches_direct (adapter-vs-script equivalence under a scratch FM_HOME)"
    py: {status: implemented, evidence: ["fm_mcp_server.py:tool_fleet_snapshot", "adapter/dispatch.py:\"fleet_snapshot\""]}
    ts: {status: implemented, evidence: ["ts/src/tools.ts:fleet_snapshot"]}
    divergence: {status: none, reason: ""}
  - id: backlog
