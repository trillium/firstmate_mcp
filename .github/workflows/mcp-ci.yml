name: mcp-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ts_fast: ${{ steps.filter.outputs.ts_fast }}
      ts_slow: ${{ steps.filter.outputs.ts_slow }}
      ts_conformance: ${{ steps.filter.outputs.ts_conformance }}
      upstream: ${{ steps.filter.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '.github/**'
              - '.gitmodules'
              - 'sources/firstmate'
              - 'drift/**'
              - 'manifest/**'
              - 'schema/**'
              - 'scripts/**'
              - 'tests/**'
              - 'ts/**'
              - '!*.md'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
            ts_fast:
              - '.github/**'
              - 'ts/**'
              - 'schema/**'
              - 'manifest/**'
              - '!*.md'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
            ts_slow:
              - '.github/**'
              - 'ts/src/runner.ts'
              - 'ts/src/server.ts'
              - 'ts/src/tools.ts'
              - 'ts/src/constants.ts'
              - 'ts/tests/timeout.test.ts'
              - 'ts/tests/receipt.test.ts'
              - 'ts/tests/helpers.ts'
              - 'ts/package.json'
              - 'ts/pnpm-lock.yaml'
              - 'ts/tsconfig*.json'
            ts_conformance:
              - '.github/**'
              - 'sources/firstmate'
              - 'schema/**'
              - 'manifest/**'
              - 'drift/**'
              - 'ts/src/**'
              - 'ts/tests/conformance*'
              - 'ts/tests/helpers.ts'
              - 'ts/scripts/conformance-runner.mjs'
              - 'ts/package.json'
              - 'ts/pnpm-lock.yaml'
              - 'ts/tsconfig*.json'
            upstream:
              - '.github/**'
              - 'sources/firstmate'
              - 'ts/src/**'
              - 'tests/upstream/**'
              - 'scripts/**'
              - 'manifest/**'
              - 'schema/**'

  schema:
    name: schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml jsonschema
      - name: schema files are valid JSON Schema draft 2020-12
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          from jsonschema import Draft202012Validator
          files = sorted(glob.glob("schema/*.schema.json"))
          assert files, "no schema/*.schema.json found"
          for path in files:
              schema = json.load(open(path, encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"ok: {path}")
          PYEOF
      - name: seed contracts validate (plus stale/invalid refusal proof)
        run: bash tests/mcp-schema.test.sh

  unit:
    name: unit / validators / auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: boundary behavior tests
        run: bash tests/mcp-adapter.test.sh
      - name: authz tier and timing tests
        run: bash tests/fm-mcp-authz.test.sh
      - name: commit-msg hook and setup tests
        run: bash tests/mcp-hooks.test.sh

  ts-fast:
    name: ts-fast (${{ matrix.runtime }})
    needs: changes
    if: needs.changes.outputs.ts_fast == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "ts/pnpm-lock.yaml"
      - name: install dependencies
        run: |
          cd ts
          pnpm install --frozen-lockfile
      - name: run fast unit & smarts tests (bun)
        run: |
          cd ts
          bun run test:fast

  ts-slow:
    name: ts-slow (${{ matrix.runtime }})
    needs: changes
    if: needs.changes.outputs.ts_slow == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "ts/pnpm-lock.yaml"
      - name: install dependencies
        run: |
          cd ts
          pnpm install --frozen-lockfile
      - name: run slow timing & receipt tests (bun)
        run: |
          cd ts
          bun run test:slow

  ts-conformance:
    name: ts-conformance (${{ matrix.runtime }}, shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.ts_conformance == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun]
        shard: [read, remote, system]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "ts/pnpm-lock.yaml"
      - name: restore conformance cache
        uses: actions/cache@v4
        with:
          path: ts/.cache/conformance
          key: conformance-${{ matrix.runtime }}-${{ matrix.shard }}-${{ hashFiles('sources/firstmate', 'schema/**', 'manifest/**', 'ts/src/**', 'ts/tests/conformance*', 'ts/pnpm-lock.yaml') }}
      - name: install dependencies
        run: |
          cd ts
          pnpm install --frozen-lockfile
      - name: run conformance tests (bun)
        run: |
          cd ts
          bun run conformance:${{ matrix.shard }}

  manifest:
    name: manifest and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: feature manifest validation
        run: bash tests/fm-manifest.test.sh
      - name: support coverage validation
        run: bash tests/fm-coverage.test.sh

  upstream:
    name: upstream preservation
    needs: changes
    if: needs.changes.outputs.upstream == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "ts/pnpm-lock.yaml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: upstream tests unchanged against py + ts
        run: bash tests/upstream/run_upstream.sh

  drift:
    name: drift-baseline freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: contract map, matrix view, and pin table agree
        run: |
          python3 - <<'PYEOF'
          import re
          import sys
          import yaml
          from pathlib import Path

          contracts = yaml.safe_load(Path("schema/contracts.yaml").read_text(encoding="utf-8"))["contracts"]
          seed_names = [c["name"] for c in contracts]
          seed_pins = {c["name"]: c["pinned"] for c in contracts}
          failures = []

          matrix = Path("schema/matrix.md").read_text(encoding="utf-8")
          for name in seed_names:
              if name not in matrix:
                  failures.append(f"matrix.md missing contract '{name}'")

          validator = Path("schema/validate.py").read_text(encoding="utf-8")
          table = dict(re.findall(r'"(\w+)":\s*"([\w.\-]+)"', validator.split("CURRENT_PINS")[1].split("}")[0]))
          for name, pin in seed_pins.items():
              if table.get(name) != pin:
                  failures.append(
                      f"validate.py CURRENT_PINS['{name}']={table.get(name)!r} != seed pinned={pin!r}"
                  )
          for name in table:
              if name not in seed_pins:
                  failures.append(f"validate.py CURRENT_PINS has extra entry '{name}' not in seed")

          if failures:
              print("DRIFT DETECTED:")
              print("\n".join(f" - {f}" for f in failures))
              sys.exit(1)
          print(f"ok: {len(seed_names)} contracts agree across contracts.yaml, matrix.md, validate.py")
          PYEOF

  ci-gate:
    name: ci merge gate
    needs: [changes, schema, unit, manifest, drift, ts-fast, ts-slow, ts-conformance, upstream]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check required jobs
        run: |
          python3 - <<'PYEOF'
          import sys
          results = {
              "changes": "${{ needs.changes.result }}",
              "schema": "${{ needs.schema.result }}",
              "unit": "${{ needs.unit.result }}",
              "manifest": "${{ needs.manifest.result }}",
              "drift": "${{ needs.drift.result }}",
              "ts-fast": "${{ needs.ts-fast.result }}",
              "ts-slow": "${{ needs.ts-slow.result }}",
              "ts-conformance": "${{ needs.ts-conformance.result }}",
              "upstream": "${{ needs.upstream.result }}",
          }
          print("Job results:", results)
          for job, res in results.items():
              if job in ("ts-fast", "ts-slow", "ts-conformance", "upstream"):
                  if res not in ("success", "skipped"):
                      print(f"FAILED: {job} status is {res}")
                      sys.exit(1)
              else:
                  if res != "success":
                      print(f"FAILED: {job} status is {res}")
                      sys.exit(1)
          print("All required checks passed (or cleanly skipped).")
          PYEOF
