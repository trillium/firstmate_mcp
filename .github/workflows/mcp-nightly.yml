name: mcp-nightly

# Scheduled full CI run: exercises every test leg, both runtimes (Bun + Node),
# and all slow/conformance proofs without cache/hash-skip to detect environment
# drift (bun bumps, runner images, timing flakes, dependency updates).

on:
  schedule:
    - cron: "17 4 * * *" # daily ~04:17 UTC
  workflow_dispatch:

env:
  NO_CACHE: "1"
  NIGHTLY_FULL_RUN: "1"

jobs:
  schema:
    name: schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml jsonschema
      - name: schema files are valid JSON Schema draft 2020-12
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          from jsonschema import Draft202012Validator
          files = sorted(glob.glob("schema/*.schema.json"))
          assert files, "no schema/*.schema.json found"
          for path in files:
              schema = json.load(open(path, encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              print(f"ok: {path}")
          PYEOF
      - name: seed contracts validate
        run: bash tests/mcp-schema.test.sh

  unit:
    name: unit / validators / auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: boundary behavior tests
        run: bash tests/mcp-adapter.test.sh
      - name: authz tier and timing tests
        run: bash tests/fm-mcp-authz.test.sh
      - name: commit-msg hook and setup tests
        run: bash tests/mcp-hooks.test.sh

  ts-fast:
    name: ts-fast (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "ts/pnpm-lock.yaml"
      - name: install dependencies
        run: |
          cd ts
          pnpm install --frozen-lockfile
      - name: run fast unit & smarts tests (bun)
        if: matrix.runtime == 'bun'
        run: |
          cd ts
          bun run test:fast:bun
      - name: run fast unit & smarts tests (node)
        if: matrix.runtime == 'node'
        run: |
          cd ts
          pnpm run test:fast

  ts-slow:
    name: ts-slow (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "ts/pnpm-lock.yaml"
      - name: install dependencies
        run: |
          cd ts
          pnpm install --frozen-lockfile
      - name: run slow timing & receipt tests (bun)
        if: matrix.runtime == 'bun'
        run: |
          cd ts
          bun run test:slow:bun
      - name: run slow timing & receipt tests (node)
        if: matrix.runtime == 'node'
        run: |
          cd ts
          pnpm run test:slow

  ts-conformance:
    name: ts-conformance (${{ matrix.runtime }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
        shard: [read, remote, system]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "ts/pnpm-lock.yaml"
      - name: install dependencies
        run: |
          cd ts
          pnpm install --frozen-lockfile
      - name: run conformance tests uncached (bun)
        if: matrix.runtime == 'bun'
        run: |
          cd ts
          bun run conformance:${{ matrix.shard }}:bun -- --no-cache
      - name: run conformance tests uncached (node)
        if: matrix.runtime == 'node'
        run: |
          cd ts
          pnpm run conformance:${{ matrix.shard }} -- --no-cache

  ts-parity:
    name: ts multi-runtime parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "ts/pnpm-lock.yaml"
      - name: full multi-runtime parity suite
        run: bash tests/conformance/ts-parity.sh

  manifest:
    name: manifest and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: feature manifest validation
        run: bash tests/fm-manifest.test.sh
      - name: support coverage validation
        run: bash tests/fm-coverage.test.sh

  upstream:
    name: upstream preservation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "ts/pnpm-lock.yaml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: upstream tests unchanged against py + ts
        run: bash tests/upstream/run_upstream.sh

  drift:
    name: drift-baseline freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: contract map, matrix view, and pin table agree
        run: |
          python3 - <<'PYEOF'
          import re
          import sys
          import yaml
          from pathlib import Path

          contracts = yaml.safe_load(Path("schema/contracts.yaml").read_text(encoding="utf-8"))["contracts"]
          seed_names = [c["name"] for c in contracts]
          seed_pins = {c["name"]: c["pinned"] for c in contracts}
          failures = []

          matrix = Path("schema/matrix.md").read_text(encoding="utf-8")
          for name in seed_names:
              if name not in matrix:
                  failures.append(f"matrix.md missing contract '{name}'")

          validator = Path("schema/validate.py").read_text(encoding="utf-8")
          table = dict(re.findall(r'"(\w+)":\s*"([\w.\-]+)"', validator.split("CURRENT_PINS")[1].split("}")[0]))
          for name, pin in seed_pins.items():
              if table.get(name) != pin:
                  failures.append(
                      f"validate.py CURRENT_PINS['{name}']={table.get(name)!r} != seed pinned={pin!r}"
                  )
          for name in table:
              if name not in seed_pins:
                  failures.append(f"validate.py CURRENT_PINS has extra entry '{name}' not in seed")

          if failures:
              print("DRIFT DETECTED:")
              print("\n".join(f" - {f}" for f in failures))
              sys.exit(1)
          print(f"ok: {len(seed_names)} contracts agree across contracts.yaml, matrix.md, validate.py")
          PYEOF

  nightly-gate:
    name: nightly merge gate
    needs: [schema, unit, manifest, drift, ts-fast, ts-slow, ts-conformance, ts-parity, upstream]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check all nightly jobs
        run: |
          python3 - <<'PYEOF'
          import sys
          results = {
              "schema": "${{ needs.schema.result }}",
              "unit": "${{ needs.unit.result }}",
              "manifest": "${{ needs.manifest.result }}",
              "drift": "${{ needs.drift.result }}",
              "ts-fast": "${{ needs.ts-fast.result }}",
              "ts-slow": "${{ needs.ts-slow.result }}",
              "ts-conformance": "${{ needs.ts-conformance.result }}",
              "ts-parity": "${{ needs.ts-parity.result }}",
              "upstream": "${{ needs.upstream.result }}",
          }
          print("Nightly Job results:", results)
          for job, res in results.items():
              if res != "success":
                  print(f"FAILED: {job} status is {res}")
                  sys.exit(1)
          print("All nightly checks passed successfully.")
          PYEOF
