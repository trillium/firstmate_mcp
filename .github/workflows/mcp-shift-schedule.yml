name: mcp-shift-schedule

# Daily upstream-shift watch: diffs the sources/firstmate submodule pin against
# upstream main and opens an issue with the PORT/IGNORE breakdown only when a
# depended-on surface moved. Quiet when nothing moved (no noise, no empty issues).
# Fast path first: drift/shift.py polls the upstream Atom feed
# (github.com/kunchenguid/firstmate/commits/main.atom, no API auth, no rate
# limit) against the pin - the pin is the cached SHA, quiet when unchanged -
# and runs the heavier ls-remote + bin/ diff only when the feed moved or is
# unreadable (loud warning, fail-open to the full path).
# Detector lives in drift/shift.py (Atom poll in drift/atom.py); fire-vs-silence gating lives in
# scripts/mcp-shift-schedule.sh (covered hermetically by
# tests/mcp-shift-schedule.test.sh). Read-only against upstream (ls-remote/fetch).

on:
  schedule:
    - cron: "23 7 * * *" # daily ~07:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  shift:
    name: upstream shift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: fetch upstream main objects (read-only)
        run: git -C sources/firstmate fetch origin main --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: run shift detector (atom fast-path first; fire writes report, silence writes nothing)
        id: shift
        run: bash scripts/mcp-shift-schedule.sh --body "${RUNNER_TEMP}/shift-report.md"
      - name: open issue on detected movement
        if: steps.shift.outputs.shift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: ${{ steps.shift.outputs.upstream }}
          PINNED: ${{ steps.shift.outputs.pinned }}
          BODY: ${{ runner.temp }}/shift-report.md
        run: |
          # All gh logic lives in the tested script (see --file-issue): the
          # inline version shipped a `--jq` without `--json` and an
          # `upstream-shift` label that did not exist, so this step failed on
          # every scheduled run for five days (2026-09-18..22).
          bash scripts/mcp-shift-schedule.sh --file-issue \
            --body "$BODY" --upstream "$UPSTREAM" --pinned "$PINNED"
